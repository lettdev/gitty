# Copy to ~/.config/gitty/config.toml (Windows: %APPDATA%\gitty\config.toml)

# auto | unicode | nerd | ascii
symbols = "auto"

# auto | truecolor | 256 | 16 | none
color = "auto"

# Capture the mouse. Hold Shift (Option on macOS) to select text anyway.
mouse = true

# History starts with all branches; press `a` there to toggle.
all_branches = true

# Folders scanned for repositories in the Repos view (5).
# Default: the folder that contains the current repository.
# workspaces = ["~/Works", "~/code"]

# Rebind any action. A value is one key or a list of keys.
# Modifiers: ctrl+, alt+, shift+. Names: space enter esc tab backtab up down
# left right pageup pagedown home end backspace delete f1..f12.
# Press ? in gitty to see every action name and its current keys.
[keys]
# stage = "space"
# commit = "c"
# quit = ["q", "ctrl+c"]
# next_hunk = ["]", "n"]
