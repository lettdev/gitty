[workspace]
resolver = "3"
members = ["crates/gitty-core", "crates/gitty-tui", "apps/desktop/src-tauri"]
# the desktop app needs the built frontend; build it with `npm run tauri build`
default-members = ["crates/gitty-core", "crates/gitty-tui"]

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/lettdev/gitty"

[workspace.dependencies]
gitty-core = { path = "crates/gitty-core" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
